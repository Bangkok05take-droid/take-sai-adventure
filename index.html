<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="たけとサイの大冒険 〜アユタヤの夢見る遺跡〜：スマホで遊べるターン制ダンジョン探索ゲーム">
  <title>たけとサイの大冒険 〜アユタヤの夢見る遺跡〜</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen active">
      <canvas id="title-bg" aria-hidden="true"></canvas>
      <div class="title-stage">
        <div class="title-head">
          <h1 class="title-logo"><img id="title-logo" src="assets/logo.png" alt="たけとサイの大冒険" draggable="false"></h1>
          <p class="subtitle">〜 アユタヤの夢見る遺跡 〜</p>
        </div>
        <div class="title-art"><img id="title-chars" src="assets/title-chars.webp" alt="たけとサイ" draggable="false"></div>
        <div class="title-buttons">
          <button id="btn-continue" class="big primary">つづきから</button>
          <button id="btn-newgame" class="big">はじめから</button>
          <div class="title-row">
            <button id="btn-help-title" class="big sub">遊び方</button>
            <button id="btn-sound-title" class="big sub">音：オン</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 村 -->
    <section id="screen-village" class="screen">
      <header class="vhud">
        <div class="vhud-item"><span class="lbl">村の資金</span><b id="v-funds">0</b>G</div>
        <div class="vhud-item"><span class="lbl" id="v-stage-lbl">村</span><b id="v-stage">小さなお店</b></div>
        <div class="vhud-item"><span class="lbl">最深</span><b id="v-best">-</b></div>
        <button id="v-menu" class="icon-btn" aria-label="メニュー">≡</button>
      </header>
      <div id="v-chapter" class="vchapter"></div>
      <div id="v-goal" class="vgoal"></div>
      <div id="village-view"><canvas id="village-canvas"></canvas></div>
      <div class="vbuttons">
        <button data-fac="shop" class="fac"><span class="ico">🏪</span>サイの店</button>
        <button data-fac="storage" class="fac"><span class="ico">📦</span>倉庫</button>
        <button data-fac="smith" class="fac"><span class="ico">🔨</span>鍛冶屋</button>
        <button data-fac="diner" class="fac"><span class="ico">🍛</span>食堂</button>
        <button data-fac="museum" class="fac"><span class="ico">🏛️</span>展示室</button>
        <button data-fac="develop" class="fac"><span class="ico">🏮</span>村の発展</button>
        <button data-fac="bag" class="fac"><span class="ico">🎒</span>持ち物</button>
        <button data-fac="depart" class="fac depart"><span class="ico">🧭</span>出発</button>
      </div>
    </section>

    <!-- ダンジョン -->
    <section id="screen-dungeon" class="screen">
      <header id="hud">
        <div class="hud-row">
          <b id="h-floor" class="floor">地下1階</b>
          <span id="h-lv" class="lv">Lv1</span>
          <span id="h-status" class="status"></span>
          <span class="hpwrap"><span class="lbl">HP</span><span class="bar"><i id="h-hpbar"></i></span><b id="h-hp">30/30</b></span>
        </div>
        <div class="hud-row small">
          <span class="foodwrap"><span class="lbl">満腹</span><span class="bar food"><i id="h-foodbar"></i></span><b id="h-food">100</b>%</span>
          <span class="stat">攻<b id="h-atk">4</b> 防<b id="h-def">0</b></span>
          <span class="gold"><b id="h-gold">0</b>G</span>
          <button id="h-map" class="mini-btn">地図</button>
        </div>
      </header>
      <div id="log" role="log" aria-live="polite"></div>
      <div id="view">
        <canvas id="dungeon-canvas"></canvas>
        <div id="toast"></div>
        <div id="stopnote"></div>
        <div id="facenote">向き変更中</div>
        <div id="restnote">休息中…</div>
      </div>
      <div id="controls">
        <div id="dpadwrap">
        <div id="dpad">
          <button class="dir" data-dir="upleft" aria-label="左上"><i style="--r:-45deg"></i></button>
          <button class="dir" data-dir="up" aria-label="上"><i style="--r:0deg"></i></button>
          <button class="dir" data-dir="upright" aria-label="右上"><i style="--r:45deg"></i></button>
          <button class="dir" data-dir="left" aria-label="左"><i style="--r:-90deg"></i></button>
          <button id="b-face" class="wait" aria-label="向き変更モード" aria-pressed="false">向き</button>
          <button class="dir" data-dir="right" aria-label="右"><i style="--r:90deg"></i></button>
          <button class="dir" data-dir="downleft" aria-label="左下"><i style="--r:-135deg"></i></button>
          <button class="dir" data-dir="down" aria-label="下"><i style="--r:180deg"></i></button>
          <button class="dir" data-dir="downright" aria-label="右下"><i style="--r:135deg"></i></button>
        </div>
        <div class="facehint">中央 タップ：向き／長押し：回復待ち</div>
        </div>
        <div id="actions">
          <button id="b-foot" class="act">足元</button>
          <button id="b-dash" class="act dash" aria-pressed="false">ダッシュ<small>オフ</small></button>
          <button id="b-wait" class="act">足踏み</button>
          <button id="b-items" class="act">道具</button>
          <button id="b-menu" class="act">メニュー</button>
        </div>
      </div>
    </section>

    <div id="modal-root"></div>
    <div id="flash"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/story.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/game.js"></script>
  <script src="js/bossai.js"></script>
  <script src="js/save.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/village.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
